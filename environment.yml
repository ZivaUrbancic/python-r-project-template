name: python-r-template

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.12
  - pip
  - ipykernel
  - numpy
  - pandas
  - matplotlib
  - ruff
  - r-base=4.5
  - r-ggplot2
  - r-languageserver
  - r-irkernel
  - r-styler
  - r-png
  - r-rcurl
  - r-xml
  - r-rsqlite
  - samtools
  - bioconductor-rhtslib
  - zlib
  - libxml2
  - libpng
  - curl
  - libcurl
  - xz
  - bowtie2
  - hisat2
  - subread
